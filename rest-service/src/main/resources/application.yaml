server:
  port: 8081

spring:
  application:
    name: rest-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: demo
    password: demo
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

demo:
  email-service:
    base-url: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,bulkheads
  endpoint:
    health:
      show-details: always
  health:
    bulkheads:
      enabled: true

resilience4j:
  bulkhead:
    instances:
      emailService:
        max-concurrent-calls: 4
        max-wait-duration: 700
